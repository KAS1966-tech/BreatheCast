services:
  db:
    image: postgres:18
    container_name: postgres_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_DB=${DATABASE_DB}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - breathecast_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    image: breathecast-backend:latest
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ../frontend
    image: breathecast-frontend:latest
    container_name: vite_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env.development
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  breathecast_postgres_data: