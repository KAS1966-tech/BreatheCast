<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
>
  <defs>
    <linearGradient
      id="aqiSpectrum"
      x1="60"
      y1="120"
      x2="450"
      y2="390"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="aqiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle
    cx="256"
    cy="256"
    r="180"
    stroke="url(#aqiSpectrum)"
    stroke-width="6"
    stroke-opacity="0.25"
    stroke-dasharray="16 12"
  />

  <path
    d="M256 100 C320 100 370 115 370 115 V240
       C370 330 290 395 256 412
       C222 395 142 330 142 240 V115
       C142 115 192 100 256 100 Z"
    stroke="url(#aqiSpectrum)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#aqiGlow)"
  />

  <path
    d="M110 230 C180 180 230 290 310 210
       C340 180 390 200 410 220"
    stroke="url(#aqiSpectrum)"
    stroke-width="16"
    stroke-linecap="round"
    fill="none"
  />

  <path
    d="M100 280 C170 230 220 340 310 270
       C350 240 380 260 400 270"
    stroke="url(#aqiSpectrum)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-opacity="0.85"
    fill="none"
  />

  <path
    d="M280 210 C300 190 330 190 340 210
       C348 226 332 240 318 232"
    stroke="url(#aqiSpectrum)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />

  <circle cx="310" cy="210" r="7" fill="#10B981"/>
  <circle cx="370" cy="115" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="142" cy="115" r="5" fill="#10B981" opacity="0.8"/>
</svg>